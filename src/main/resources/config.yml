# DON'T TOUCH THIS UNLESS YOU KNOW WHAT YOU ARE DOING \/
config-version: 1
# u can touch this tho \/

# Make minimum hearts 0 to ban a player when they run out of hearts.
minimum-hearts: 5.0
maximum-hearts: 15.0

revive-item: true

# Whether to ban people if they die at minimum hearts
ban-bellow-min: true

# Whether to give the killer the heart item when killing someone when they're on max hearts
reward-heart-item: true

# What places to take hearts from when being killed at minimum hearts
# (doesn't do anything if minimum is at zero as you just get banned if you get to zero hearts)
# Bar : the hearts above your hotbar (normal lifesteal)
# Inv : the hearts in your inventory + bar
# All : the hearts in you e chest + inv + bar
take-hearts: All

# What inventory types are heart items allowed to be in.
# EChest : players inventory + the ender chests
# Player : only a player's inventory
# All : all inventories (allows them to be stored in anything)
allowed-inventories: EChest

# recipes enabled to craft hearts
# None : No recipe to craft hearts
# Keys : The option of the recipe with keys https://drive.google.com/file/d/1WrzDOSns-2eps4k1LR2mTE-S7WgUSvLV/view?usp=drive_link
# Totems : The recipe option with totems https://drive.google.com/file/d/1LfiNXzPYGm4ulsKE1zTf_AJrLFm9PXKv/view?usp=drive_link
# Both : Both recipes
recipes-enabled: Both

# Whether to limit the ability to craft a heart to how many hearts the player currently has
limit-heart-crafting : true
# Maximum hearts you are able to have to be able to craft a heat.
max-heart-craft-hearts: 10.0

# What places to count hearts from when there is a heart limit (for example, crafting hearts)
# Bar : the hearts above your hotbar
# Inv : the hearts in your inventory + bar
# All : the hearts in you e chest + inv + bar
heart-count-include: All

# what to make hearts immune to
# Complete : will not despawn, will not be destroyed
# Damage : invulnerable to all except despawning
# None : normal item, no protection
indestructible-hearts: Complete

# Whether to make the heat item glow when on the ground
glowing-hearts: false