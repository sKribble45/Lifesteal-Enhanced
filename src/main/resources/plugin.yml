name: LifestealEnhanced
version: '${version}'

main: org.sKribble.lifestealEnhanced.LifestealEnhanced
api-version: '26.2'
load: POSTWORLD

commands:
  withdraw:
    description: Withdraws a heart from your HP bar to an item /withdraw
    permission: lifesteal.command.withdraw
permissions:
  lifesteal.command.withdraw:
    description: Allows a player to use use '/withdraw' to withdraw a heart
    default: true

  lifesteal.command.sethearts:
    description: Allows a player to run '/lifesteal hearts add' , '/lifesteal hearts remove' and '/lifesteal hearts set'
    default: op

  lifesteal.command.gethearts:
    description: Allows a player to execute '/lifesteal hearts get' to get how many hearts a player has
    default: op

  lifesteal.command.reload:
    description: Allows a player to reload the config of the plugin
    default: op

  lifesteal.command.give:
    description: Allows a player to use '/lifesteal give' to give someone a heart item
    default: op